<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#111114">
  <title>404 — LauMVP</title>
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="stylesheet" href="styles.css">
  <style>
    .error-page{min-height:100svh;display:grid;place-items:center;text-align:center;padding:30px;background:#111114}
    .error-inner{max-width:760px}
    .error-cat{width:min(280px,65vw);height:auto;image-rendering:pixelated;margin-bottom:10px}
    .error-page h1{font:900 clamp(100px,22vw,230px)/.7 "Barlow Condensed",Impact,sans-serif;margin:0;color:#fffdb5}
    .error-page h2{font:900 clamp(46px,9vw,92px)/.85 "Barlow Condensed",Impact,sans-serif;margin:30px 0 18px}
    .error-page p{color:#aaa49e;line-height:1.7;margin-bottom:28px}
  </style>
</head>
<body>
  <main class="error-page">
    <div class="error-inner">
      <img src="assets/laumvp-cat.png" alt="LauMVP cat mascot" class="error-cat">
      <h1>404</h1>
      <h2>THE CAT ATE THIS PAGE.</h2>
      <p>Whatever you were looking for is not here. We checked under the couch too.</p>
      <a class="button button-primary" href="index.html">Back to LauMVP <span>↗</span></a>
    </div>
  </main>

</html>
